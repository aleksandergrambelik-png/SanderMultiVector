name: SanderMultiVector Audit

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Debug - List Files
      run: |
        echo "Current directory: $(pwd)"
        ls -la
        echo "--- src folder ---"
        ls -la src/com/sander/ || echo "src/com/sander/ not found"

    - name: Install Dependencies (Perl & libcurl)
      run: |
        sudo apt-get update
        sudo apt-get install -y perl libcurl4-openssl-dev

    - name: Compile Java Source
      run: |
        mkdir -p build
        javac -d build $(find src -name "*.java") || echo "JAVAC FAILED"

    - name: Compile C++ Fuzzer
      run: |
        mkdir -p bin
        clang++ cpp/fuzzer.cpp -o bin/fuzzer_bin -lcurl -O3 -std=c++11 || echo "CLANG FAILED"

    - name: Run SanderMultiVector (Test)
      run: |
        java -cp build com.sander.Main "help" || echo "JAVA RUN FAILED"
